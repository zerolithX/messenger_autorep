          package com.example.sleepreply

          import android.app.Notification
          import android.app.PendingIntent
          import android.app.RemoteInput
          import android.content.Context
          import android.content.Intent
          import android.os.Bundle
          import android.service.notification.NotificationListenerService
          import android.service.notification.StatusBarNotification
          import java.util.Calendar

          class ReplyService : NotificationListenerService() {

              private val lastSeen = HashMap<String, String>()

              override fun onNotificationPosted(sbn: StatusBarNotification) {
                  val prefs = getSharedPreferences(Prefs.NAME, Context.MODE_PRIVATE)
                  if (!prefs.getBoolean(Prefs.ENABLED, true)) return
                  if (sbn.packageName !in listOf("com.facebook.orca", "com.facebook.mlite")) return

                  val n = sbn.notification
                  val extras = n.extras
                  val title = extras.getCharSequence(Notification.EXTRA_TITLE)?.toString()
                      ?: extras.getCharSequence(Notification.EXTRA_CONVERSATION_TITLE)?.toString()
                  val last = lastMessage(extras)
                  val text = extras.getCharSequence(Notification.EXTRA_TEXT)?.toString() ?: last?.first ?: ""
                  val isGroup = extras.getBoolean(Notification.EXTRA_IS_GROUP_CONVERSATION, false)
                  val isSummary = (n.flags and Notification.FLAG_GROUP_SUMMARY) != 0

                  val all = ArrayList<Notification.Action>()
                  n.actions?.let { all.addAll(it) }
                  all.addAll(Notification.WearableExtender(n).actions)

                  val info = "app: " + sbn.packageName +
                      "\ntitle: " + (if (title == null) "MISSING" else "ok") +
                      "\ntext: " + text.length + " characters" +
                      "\ngroup: " + isGroup + ", summary: " + isSummary +
                      "\nbuttons: " + all.joinToString { describe(it) }

                  fun done(result: String) {
                      prefs.edit().putString(Prefs.DEBUG, info + "\nresult: " + result).apply()
                  }

                  if (!inSleepWindow(prefs.getInt(Prefs.START, 23 * 60), prefs.getInt(Prefs.END, 7 * 60))) {
                      return done("outside your sleep hours, so no reply")
                  }
                  if (isSummary) return done("skipped: summary notification")
                  if (isGroup) return done("skipped: group chat")

                  val message = prefs.getString(Prefs.MESSAGE, Prefs.DEFAULT_MESSAGE) ?: Prefs.DEFAULT_MESSAGE
                  if (message.isNotEmpty() && text.contains(message)) return done("skipped: our own reply")

                  val who = title ?: sbn.key
                  val signature = n.`when`.toString() + "|" + text + "|" + (last?.second ?: 0L)
                  if (lastSeen[who] == signature) return done("skipped: same notification again")

                  val action = all.firstOrNull { a -> a.remoteInputs?.isNotEmpty() == true }
                      ?: return done("no Reply button with a text box in this notification")
                  val inputs = action.remoteInputs ?: return done("no reply input")
                  val input = inputs.firstOrNull() ?: return done("no reply input")

                  val fill = Intent()
                  val results = Bundle()
                  results.putCharSequence(input.resultKey, message)
                  RemoteInput.addResultsToIntent(inputs, fill, results)

                  try {
                      action.actionIntent.send(this, 0, fill)
                      lastSeen[who] = signature
                      done("replied")
                  } catch (e: PendingIntent.CanceledException) {
                      done("failed: notification expired")
                  }
              }

              private fun lastMessage(extras: Bundle): Pair<String, Long>? {
                  val arr = extras.getParcelableArray(Notification.EXTRA_MESSAGES) ?: return null
                  val b = arr.lastOrNull() as? Bundle ?: return null
                  return Pair(b.getCharSequence("text")?.toString() ?: "", b.getLong("time"))
              }

              private fun describe(a: Notification.Action): String {
                  val hasInput = a.remoteInputs?.isNotEmpty() == true
                  return "" + a.title + " (text box: " + hasInput + ")"
              }

              private fun inSleepWindow(start: Int, end: Int): Boolean {
                  val c = Calendar.getInstance()
                  val now = c.get(Calendar.HOUR_OF_DAY) * 60 + c.get(Calendar.MINUTE)
                  return if (start <= end) now in start until end else (now >= start || now < end)
              }
          }
          EOF

          cat > app/src/main/java/com/example/sleepreply/MainActivity.kt <<'EOF'
          package com.example.sleepreply

          import android.app.Activity
          import android.app.TimePickerDialog
          import android.content.Context
          import android.content.Intent
          import android.content.SharedPreferences
          import android.os.Bundle
          import android.provider.Settings
          import android.widget.Button
          import android.widget.EditText
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.Switch
          import android.widget.TextView
          import android.widget.Toast

          class MainActivity : Activity() {

              private lateinit var prefs: SharedPreferences
              private lateinit var accessStatus: TextView
              private lateinit var debugView: TextView

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  prefs = getSharedPreferences(Prefs.NAME, Context.MODE_PRIVATE)

                  val pad = (16 * resources.displayMetrics.density).toInt()
                  val root = LinearLayout(this)
                  root.orientation = LinearLayout.VERTICAL
                  root.setPadding(pad, pad, pad, pad)

                  val heading = TextView(this)
                  heading.text = "Messenger Reply"
                  heading.textSize = 24f
                  root.addView(heading)

                  accessStatus = TextView(this)
                  root.addView(accessStatus)

                  val accessButton = Button(this)
                  accessButton.text = "Open notification access settings"
                  accessButton.setOnClickListener {
                      startActivity(Intent(Settings.ACTION_NOTIFICATION_LISTENER_SETTINGS))
                  }
                  root.addView(accessButton)

                  val enabled = Switch(this)
                  enabled.text = "Auto-reply on"
                  enabled.isChecked = prefs.getBoolean(Prefs.ENABLED, true)
                  enabled.setOnCheckedChangeListener { _, on ->
                      prefs.edit().putBoolean(Prefs.ENABLED, on).apply()
                  }
                  root.addView(enabled)

                  val startButton = Button(this)
                  val endButton = Button(this)
                  fun refresh() {
                      startButton.text = "Start: " + format(prefs.getInt(Prefs.START, 23 * 60))
                      endButton.text = "End: " + format(prefs.getInt(Prefs.END, 7 * 60))
                  }
                  startButton.setOnClickListener { pickTime(Prefs.START, 23 * 60) { refresh() } }
                  endButton.setOnClickListener { pickTime(Prefs.END, 7 * 60) { refresh() } }
                  refresh()
                  root.addView(startButton)
                  root.addView(endButton)

                  val label = TextView(this)
                  label.text = "Reply message"
                  root.addView(label)

                  val message = EditText(this)
                  message.setText(prefs.getString(Prefs.MESSAGE, Prefs.DEFAULT_MESSAGE))
                  root.addView(message)

                  val save = Button(this)
                  save.text = "Save message"
                  save.setOnClickListener {
                      prefs.edit().putString(Prefs.MESSAGE, message.text.toString()).apply()
                      Toast.makeText(this, "Saved", Toast.LENGTH_SHORT).show()
                  }
                  root.addView(save)

                  val note = TextView(this)
                  note.text = "Replies to every Messenger message during the time window. Skips group chats."
                  root.addView(note)

                  val debugLabel = TextView(this)
                  debugLabel.text = "Last notification seen (for troubleshooting)"
                  debugLabel.setPadding(0, pad, 0, 0)
                  root.addView(debugLabel)

                  debugView = TextView(this)
                  debugView.setTextIsSelectable(true)
                  root.addView(debugView)

                  val scroll = ScrollView(this)
                  scroll.addView(root)
                  setContentView(scroll)
              }

              override fun onResume() {
                  super.onResume()
                  debugView.text = prefs.getString(Prefs.DEBUG, "Nothing seen yet.")
                  val list = Settings.Secure.getString(contentResolver, "enabled_notification_listeners") ?: ""
                  accessStatus.text = if (list.contains(packageName)) {
                      "Notification access: ON"
                  } else {
                      "Notification access: OFF. Tap the button below and allow Messenger Reply."
                  }
              }

              private fun pickTime(key: String, def: Int, done: () -> Unit) {
                  val cur = prefs.getInt(key, def)
                  TimePickerDialog(this, { _, h, m ->
                      prefs.edit().putInt(key, h * 60 + m).apply()
                      done()
                  }, cur / 60, cur % 60, true).show()
              }

              private fun format(mins: Int): String = String.format("%02d:%02d", mins / 60, mins % 60)
          }
          EOF

