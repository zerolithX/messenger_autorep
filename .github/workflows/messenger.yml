name: Build Messenger Reply APK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/messenger.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Create project files
        run: |
          mkdir -p app/src/main/java/com/example/sleepreply
          mkdir -p app/src/main/res/mipmap-xxhdpi

